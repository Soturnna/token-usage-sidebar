<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Token Usage Sidebar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="collapsed">
    <!-- Painel detalhado (hover) -->
    <section id="panel" aria-hidden="true">
      <header>
        <h1>Uso do <span translate="no">Claude</span></h1>
        <span class="plan" id="source-badge">—</span>
        <div class="hbtns">
          <button id="refresh-w" title="Atualizar" aria-label="Atualizar agora">↻</button>
          <button id="gear" title="Configurações" aria-label="Abrir painel de controle">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <!-- O que o Claude Code está fazendo agora (o mesmo estado que move os gatos) -->
      <div class="agent" id="agent-row" data-estado="offline" role="status" aria-live="polite">
        <span class="adot" aria-hidden="true"></span>
        <span class="atext" id="agent-text">Conectando ao <span translate="no">Claude Code</span>…</span>
      </div>

      <div class="prow">
        <div class="ptop"><span class="plabel">Janela de 5 horas</span><span class="pval" id="v-5h">–</span></div>
        <div class="pbar sess"><i id="bar-5h"></i></div>
        <div class="preset" id="reset-5h"></div>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <div class="prow">
        <div class="ptop"><span class="plabel">Semanal (7 dias)</span><span class="pval" id="v-7d">–</span></div>
        <div class="pbar week"><i id="bar-7d"></i></div>
        <div class="preset" id="reset-7d"></div>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <div class="summary">
        <div class="srow"><span>Pico semanal</span><b id="s-peak">–</b></div>
        <div class="srow"><span>Dias ativos</span><b id="s-days">–</b></div>
      </div>

      <footer class="pfoot">
        <span class="fupd" id="updated">—</span>
        <button class="flink" id="btn-quit">Sair</button>
      </footer>
    </section>

    <!-- Pílula encostada na borda direita -->
    <aside id="pill">
      <!-- O rótulo (5h/7d) fica DENTRO da roda: libera o espaço entre as rodas,
           onde o gato sentado apoia a cabeça sem cobrir nenhum texto -->
      <div class="gauge" data-key="5h" role="img" aria-label="Janela de 5 horas: sem dados"><div class="ring"><span class="val">–</span><span class="cap">5h</span></div></div>
      <div class="gauge" data-key="7d" role="img" aria-label="Janela de 7 dias: sem dados"><div class="ring"><span class="val">–</span><span class="cap">7d</span></div></div>
      <button id="launch" class="launch" title="Abrir Claude" aria-label="Abrir Claude">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="8.6" cy="10" r="1.1" fill="currentColor"/><circle cx="12" cy="10" r="1.1" fill="currentColor"/><circle cx="15.4" cy="10" r="1.1" fill="currentColor"/>
        </svg>
      </button>
    </aside>

    <!-- Camada dos pets: fora do #pill, que tem clip-path -->
    <div id="cats"></div>
  </div>
  <script src="cats.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
